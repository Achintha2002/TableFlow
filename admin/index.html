<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TableFlow — Admin Dashboard</title>
  <meta name="description" content="TableFlow restaurant management dashboard for queue, reservations, orders and menu." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="admin.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<div class="admin-layout">
  <!-- ──── SIDEBAR ──── -->
  <aside class="sidebar">
    <div class="sidebar-logo">
      <h1>TableFlow</h1>
      <p>Admin Console</p>
    </div>
    <nav class="sidebar-nav">
      <div class="nav-section-label">Overview</div>
      <div class="nav-item active" data-page="dashboard" onclick="navigate('dashboard', this)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
        Dashboard
      </div>
      <div class="nav-section-label">Live</div>
      <div class="nav-item" data-page="queue" onclick="navigate('queue', this)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
        Live Queue
      </div>
      <div class="nav-item" data-page="tables" onclick="navigate('tables', this)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M3 15h18M9 3v18M15 3v18"/></svg>
        Tables & Floor
      </div>
      <div class="nav-section-label">Operations</div>
      <div class="nav-item" data-page="orders" onclick="navigate('orders', this)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 5H7a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2"/><rect x="9" y="3" width="6" height="4" rx="1"/><path d="M9 12h6M9 16h4"/></svg>
        Orders
      </div>
      <div class="nav-item" data-page="reservations" onclick="navigate('reservations', this)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
        Reservations
      </div>
      <div class="nav-item" data-page="menu" onclick="navigate('menu', this)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 2v7c0 1.1.9 2 2 2h4a2 2 0 0 0 2-2V2"/><path d="M7 2v20"/><path d="M21 15V2"/><path d="M18 2c0 4.4-3.6 8-8 8"/></svg>
        Menu
      </div>
    </nav>
    <div class="sidebar-footer">
      <div class="sidebar-footer-avatar">A</div>
      <div class="sidebar-footer-info">
        <p>Admin</p>
        <span>Restaurant Manager</span>
      </div>
    </div>
  </aside>

  <!-- ──── MAIN ──── -->
  <main class="main-content">
    <div class="topbar">
      <div class="topbar-title">
        <h2 id="page-title">Dashboard</h2>
        <p id="page-subtitle">Live overview of all restaurant operations</p>
      </div>
      <div class="topbar-actions">
        <div class="live-badge">
          <div class="live-dot"></div>
          Live
        </div>
        <button class="btn btn-ghost" id="refresh-btn" onclick="loadCurrentPage()">↻ Refresh</button>
      </div>
    </div>

    <div class="page-content" id="page-content">
      <!-- Content injected by JS -->
    </div>
  </main>
</div>

<script>
// ─────────── Supabase Setup ───────────
const { createClient } = supabase;
const sb = createClient(
  'https://azjjndqecpemltvdbkvy.supabase.co',
  'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImF6ampuZHFlY3BlbWx0dmRia3Z5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY3OTA3ODEsImV4cCI6MjEwMjM2Njc4MX0.grBF4XJu0696MnrvKC-ZccppLGxPEM9KIHED8viZELc'
);

// ─────────── Navigation ───────────
let currentPage = 'dashboard';

function navigate(page, el) {
  currentPage = page;
  document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
  el.classList.add('active');
  loadCurrentPage();
}

function loadCurrentPage() {
  switch(currentPage) {
    case 'dashboard': renderDashboard(); break;
    case 'queue': renderQueue(); break;
    case 'tables': renderTables(); break;
    case 'orders': renderOrders(); break;
    case 'reservations': renderReservations(); break;
    case 'menu': renderMenu(); break;
  }
}

// ─────────── Helpers ───────────
function badge(type, text) {
  return `<span class="badge badge-${type}">${text}</span>`;
}

function fmtTime(iso) {
  if (!iso) return '—';
  return new Date(iso).toLocaleString('en-US', {
    month: 'short', day: 'numeric',
    hour: '2-digit', minute: '2-digit'
  });
}

// ─────────── DASHBOARD ───────────
async function renderDashboard() {
  document.getElementById('page-title').textContent = 'Dashboard';
  document.getElementById('page-subtitle').textContent = 'Live overview of all restaurant operations';

  // Fetch counts
  const [{ count: queueCount }, { count: orderCount }, { count: reservCount }, { count: userCount }] = await Promise.all([
    sb.from('queue_entries').select('*', { count: 'exact', head: true }).eq('status', 'waiting'),
    sb.from('orders').select('*', { count: 'exact', head: true }).in('status', ['pending', 'preparing']),
    sb.from('reservations').select('*', { count: 'exact', head: true }).eq('status', 'confirmed'),
    sb.from('profiles').select('*', { count: 'exact', head: true }),
  ]);

  // Fetch recent orders
  const { data: recentOrders } = await sb
    .from('orders')
    .select('id, status, total_amount, created_at')
    .order('created_at', { ascending: false })
    .limit(5);

  // Fetch recent queue
  const { data: recentQueue } = await sb
    .from('queue_entries')
    .select('id, party_size, status, created_at')
    .order('created_at', { ascending: false })
    .limit(5);

  const content = `
    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-card-header">
          <div class="stat-card-label">Waiting Queue</div>
          <div class="stat-card-icon" style="background:rgba(184,127,92,0.15)">👥</div>
        </div>
        <div class="stat-card-value">${queueCount ?? 0}</div>
        <div class="stat-card-change">● Active parties</div>
      </div>
      <div class="stat-card">
        <div class="stat-card-header">
          <div class="stat-card-label">Active Orders</div>
          <div class="stat-card-icon" style="background:rgba(91,155,213,0.15)">🍽️</div>
        </div>
        <div class="stat-card-value">${orderCount ?? 0}</div>
        <div class="stat-card-change">● In kitchen</div>
      </div>
      <div class="stat-card">
        <div class="stat-card-header">
          <div class="stat-card-label">Confirmed Bookings</div>
          <div class="stat-card-icon" style="background:rgba(76,175,125,0.15)">📅</div>
        </div>
        <div class="stat-card-value">${reservCount ?? 0}</div>
        <div class="stat-card-change">● Tonight</div>
      </div>
      <div class="stat-card">
        <div class="stat-card-header">
          <div class="stat-card-label">Total Users</div>
          <div class="stat-card-icon" style="background:rgba(212,175,55,0.15)">⭐</div>
        </div>
        <div class="stat-card-value">${userCount ?? 0}</div>
        <div class="stat-card-change">● Registered</div>
      </div>
    </div>

    <div class="data-grid">
      <div class="data-card">
        <div class="data-card-header">
          <h3>Recent Orders</h3>
          <button class="btn btn-ghost" onclick="navigate('orders', document.querySelector('[data-page=orders]'))">View all</button>
        </div>
        <table class="data-table">
          <thead><tr><th>Order ID</th><th>Amount</th><th>Status</th><th>Time</th></tr></thead>
          <tbody>
            ${recentOrders?.length ? recentOrders.map(o => `
              <tr>
                <td style="color:var(--text-primary);font-family:monospace">#${o.id.slice(0,8)}</td>
                <td>$${(o.total_amount ?? 0).toFixed(2)}</td>
                <td>${badge(o.status === 'served' ? 'success' : o.status === 'preparing' ? 'info' : o.status === 'pending' ? 'warning' : 'muted', o.status)}</td>
                <td>${fmtTime(o.created_at)}</td>
              </tr>`).join('') : '<tr><td colspan="4" style="text-align:center;color:var(--text-muted)">No orders yet</td></tr>'}
          </tbody>
        </table>
      </div>
      <div class="data-card">
        <div class="data-card-header">
          <h3>Live Queue</h3>
          <button class="btn btn-ghost" onclick="navigate('queue', document.querySelector('[data-page=queue]'))">View all</button>
        </div>
        <table class="data-table">
          <thead><tr><th>Entry ID</th><th>Party</th><th>Status</th><th>Joined</th></tr></thead>
          <tbody>
            ${recentQueue?.length ? recentQueue.map(q => `
              <tr>
                <td style="color:var(--text-primary);font-family:monospace">#${q.id.slice(0,8)}</td>
                <td>👥 ${q.party_size}</td>
                <td>${badge(q.status === 'seated' ? 'success' : q.status === 'waiting' ? 'warning' : 'muted', q.status)}</td>
                <td>${fmtTime(q.created_at)}</td>
              </tr>`).join('') : '<tr><td colspan="4" style="text-align:center;color:var(--text-muted)">Queue is empty</td></tr>'}
          </tbody>
        </table>
      </div>
    </div>
  `;
  document.getElementById('page-content').innerHTML = content;
}

// ─────────── QUEUE ───────────
async function renderQueue() {
  document.getElementById('page-title').textContent = 'Live Queue';
  document.getElementById('page-subtitle').textContent = 'Real-time waitlist management';
  document.getElementById('page-content').innerHTML = '<p style="color:var(--text-muted)">Loading...</p>';

  const { data } = await sb
    .from('queue_entries')
    .select('*')
    .order('created_at', { ascending: true });

  document.getElementById('page-content').innerHTML = `
    <div class="full-data-card">
      <div class="data-card-header">
        <h3>All Queue Entries (${data?.length ?? 0})</h3>
      </div>
      <table class="data-table">
        <thead><tr><th>#</th><th>Entry ID</th><th>Party Size</th><th>Status</th><th>Joined</th><th>Actions</th></tr></thead>
        <tbody>
          ${data?.length ? data.map((q, i) => `
            <tr>
              <td style="color:var(--text-muted)">${i+1}</td>
              <td style="color:var(--text-primary);font-family:monospace">#${q.id.slice(0,8)}</td>
              <td>👥 ${q.party_size} people</td>
              <td>${badge(q.status === 'seated' ? 'success' : q.status === 'waiting' ? 'warning' : 'muted', q.status)}</td>
              <td>${fmtTime(q.created_at)}</td>
              <td>
                ${q.status === 'waiting' ? `<button class="btn btn-primary" style="padding:5px 12px;font-size:12px" onclick="seatQueue('${q.id}')">Seat Now</button>` : ''}
              </td>
            </tr>`).join('') : '<tr><td colspan="6" style="text-align:center;color:var(--text-muted);padding:32px">Queue is empty</td></tr>'}
        </tbody>
      </table>
    </div>
  `;

  // Subscribe to real-time queue updates
  sb.channel('admin_queue').onPostgresChanges(
    { event: '*', schema: 'public', table: 'queue_entries' },
    () => { if (currentPage === 'queue') renderQueue(); }
  ).subscribe();
}

async function seatQueue(id) {
  await sb.from('queue_entries').update({ status: 'seated' }).eq('id', id);
  renderQueue();
}

// ─────────── TABLES ───────────
async function renderTables() {
  document.getElementById('page-title').textContent = 'Tables & Floor';
  document.getElementById('page-subtitle').textContent = 'Manage restaurant seating capacity';
  document.getElementById('page-content').innerHTML = '<p style="color:var(--text-muted)">Loading...</p>';

  const { data } = await sb.from('tables').select('*').order('table_number');

  document.getElementById('page-content').innerHTML = `
    <div class="full-data-card">
      <div class="data-card-header">
        <h3>All Tables (${data?.length ?? 0})</h3>
        <div style="display:flex;gap:12px;align-items:center">
          <span style="font-size:12px;color:var(--text-muted)">🟢 Available &nbsp; 🔴 Occupied &nbsp; ⭐ VIP</span>
        </div>
      </div>
      <table class="data-table">
        <thead><tr><th>Table #</th><th>Capacity</th><th>Type</th><th>Status</th><th>Actions</th></tr></thead>
        <tbody>
          ${data?.length ? data.map(t => `
            <tr>
              <td style="color:var(--text-primary);font-weight:600">Table ${t.table_number}</td>
              <td>👥 ${t.capacity} seats</td>
              <td>${t.is_vip ? badge('warning', 'VIP') : badge('muted', 'Standard')}</td>
              <td>${t.status === 'available' ? badge('success', 'Available') : t.status === 'occupied' ? badge('danger', 'Occupied') : badge('info', t.status)}</td>
              <td>
                ${t.status === 'occupied' ? `<button class="btn btn-ghost" style="padding:5px 12px;font-size:12px" onclick="updateTableStatus('${t.id}','available')">Mark Free</button>` : `<button class="btn btn-ghost" style="padding:5px 12px;font-size:12px" onclick="updateTableStatus('${t.id}','occupied')">Mark Occupied</button>`}
              </td>
            </tr>`).join('') : '<tr><td colspan="5" style="text-align:center;color:var(--text-muted);padding:32px">No tables found</td></tr>'}
        </tbody>
      </table>
    </div>
  `;
}

async function updateTableStatus(id, status) {
  await sb.from('tables').update({ status }).eq('id', id);
  renderTables();
}

// ─────────── ORDERS ───────────
async function renderOrders() {
  document.getElementById('page-title').textContent = 'Orders';
  document.getElementById('page-subtitle').textContent = 'Kitchen queue and order management';
  document.getElementById('page-content').innerHTML = '<p style="color:var(--text-muted)">Loading...</p>';

  const { data } = await sb
    .from('orders')
    .select('*')
    .order('created_at', { ascending: false })
    .limit(50);

  document.getElementById('page-content').innerHTML = `
    <div class="full-data-card">
      <div class="data-card-header">
        <h3>All Orders</h3>
      </div>
      <table class="data-table">
        <thead><tr><th>Order ID</th><th>Table</th><th>Amount</th><th>Status</th><th>Time</th><th>Update</th></tr></thead>
        <tbody>
          ${data?.length ? data.map(o => `
            <tr>
              <td style="color:var(--text-primary);font-family:monospace">#${o.id.slice(0,8)}</td>
              <td>${o.table_id ? o.table_id.slice(0,8) : '—'}</td>
              <td>$${(o.total_amount ?? 0).toFixed(2)}</td>
              <td>${badge(o.status === 'served' ? 'success' : o.status === 'preparing' ? 'info' : o.status === 'pending' ? 'warning' : 'muted', o.status)}</td>
              <td>${fmtTime(o.created_at)}</td>
              <td>
                <select onchange="updateOrderStatus('${o.id}', this.value)" style="background:var(--bg-card-hover);color:var(--text-primary);border:1px solid var(--border);border-radius:6px;padding:4px 8px;font-size:12px">
                  <option value="pending" ${o.status==='pending'?'selected':''}>Pending</option>
                  <option value="preparing" ${o.status==='preparing'?'selected':''}>Preparing</option>
                  <option value="ready" ${o.status==='ready'?'selected':''}>Ready</option>
                  <option value="served" ${o.status==='served'?'selected':''}>Served</option>
                </select>
              </td>
            </tr>`).join('') : '<tr><td colspan="6" style="text-align:center;color:var(--text-muted);padding:32px">No orders yet</td></tr>'}
        </tbody>
      </table>
    </div>
  `;
}

async function updateOrderStatus(id, status) {
  await sb.from('orders').update({ status }).eq('id', id);
}

// ─────────── RESERVATIONS ───────────
async function renderReservations() {
  document.getElementById('page-title').textContent = 'Reservations';
  document.getElementById('page-subtitle').textContent = 'Upcoming table bookings';
  document.getElementById('page-content').innerHTML = '<p style="color:var(--text-muted)">Loading...</p>';

  const { data } = await sb
    .from('reservations')
    .select('*')
    .order('reservation_time', { ascending: true })
    .limit(50);

  document.getElementById('page-content').innerHTML = `
    <div class="full-data-card">
      <div class="data-card-header"><h3>All Reservations</h3></div>
      <table class="data-table">
        <thead><tr><th>ID</th><th>Table</th><th>Party</th><th>Time</th><th>Status</th><th>Requests</th></tr></thead>
        <tbody>
          ${data?.length ? data.map(r => `
            <tr>
              <td style="color:var(--text-primary);font-family:monospace">#${r.id.slice(0,8)}</td>
              <td>${r.table_id ? r.table_id.slice(0,8) : '—'}</td>
              <td>👥 ${r.party_size}</td>
              <td>${fmtTime(r.reservation_time)}</td>
              <td>${badge(r.status === 'confirmed' ? 'success' : r.status === 'cancelled' ? 'danger' : 'muted', r.status)}</td>
              <td style="max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${r.special_requests || '—'}</td>
            </tr>`).join('') : '<tr><td colspan="6" style="text-align:center;color:var(--text-muted);padding:32px">No reservations found</td></tr>'}
        </tbody>
      </table>
    </div>
  `;
}

// ─────────── MENU ───────────
async function renderMenu() {
  document.getElementById('page-title').textContent = 'Menu';
  document.getElementById('page-subtitle').textContent = 'Manage dishes and availability';
  document.getElementById('page-content').innerHTML = '<p style="color:var(--text-muted)">Loading...</p>';

  const { data } = await sb.from('menu_items').select('*').order('category');

  document.getElementById('page-content').innerHTML = `
    <div class="full-data-card">
      <div class="data-card-header">
        <h3>All Menu Items (${data?.length ?? 0})</h3>
      </div>
      <table class="data-table">
        <thead><tr><th>Name</th><th>Category</th><th>Price</th><th>Available</th><th>Toggle</th></tr></thead>
        <tbody>
          ${data?.length ? data.map(m => `
            <tr>
              <td style="color:var(--text-primary);font-weight:500">${m.name}</td>
              <td>${badge('muted', m.category ?? '—')}</td>
              <td style="color:var(--primary)">$${(m.price ?? 0).toFixed(2)}</td>
              <td>${m.is_available ? badge('success', 'Yes') : badge('danger', 'No')}</td>
              <td>
                <button class="btn btn-ghost" style="padding:5px 12px;font-size:12px" onclick="toggleMenuItem('${m.id}', ${m.is_available})">
                  ${m.is_available ? 'Disable' : 'Enable'}
                </button>
              </td>
            </tr>`).join('') : '<tr><td colspan="5" style="text-align:center;color:var(--text-muted);padding:32px">No menu items found</td></tr>'}
        </tbody>
      </table>
    </div>
  `;
}

async function toggleMenuItem(id, current) {
  await sb.from('menu_items').update({ is_available: !current }).eq('id', id);
  renderMenu();
}

// ─────────── INIT ───────────
renderDashboard();
</script>
</body>
</html>
