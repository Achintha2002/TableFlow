name: Keep Supabase Active

on:
  schedule:
    # Dawas 4kata serayak run wenawa (UTC 00:00)
    - cron: '0 0 */4 * *'
  workflow_dispatch: # Actions tab eken manually run karanna puluwan

jobs:
  ping-supabase:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase API
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          # 1. Clean whitespace, newlines, carriage returns, and quotes
          CLEAN_URL=$(echo "$SUPABASE_URL" | tr -d '\r\n "' | sed 's:/*$::')
          CLEAN_KEY=$(echo "$SUPABASE_ANON_KEY" | tr -d '\r\n "')

          # 2. Check if secrets are missing
          if [ -z "$CLEAN_URL" ]; then
            echo "❌ Error: SUPABASE_URL secret is empty or missing! Please check GitHub Secrets."
            exit 1
          fi

          if [ -z "$CLEAN_KEY" ]; then
            echo "❌ Error: SUPABASE_ANON_KEY secret is empty or missing! Please check GitHub Secrets."
            exit 1
          fi

          # 3. Target the public 'menu_items' table with limit 1
          ENDPOINT="${CLEAN_URL}/rest/v1/menu_items?select=id&limit=1"

          # 4. Make request and capture HTTP status + response body
          RESPONSE_FILE=$(mktemp)
          HTTP_STATUS=$(curl -sS -w "%{http_code}" -o "$RESPONSE_FILE" -X GET "$ENDPOINT" \
            -H "apikey: $CLEAN_KEY" \
            -H "Authorization: Bearer $CLEAN_KEY")

          RESPONSE_BODY=$(cat "$RESPONSE_FILE")
          echo "Supabase HTTP response code: $HTTP_STATUS"

          if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 400 ]; then
            echo "✅ Success! Supabase database responded with $HTTP_STATUS. Project is kept active!"
          else
            echo "Response body: $RESPONSE_BODY"
            echo "❌ Failed with HTTP status: $HTTP_STATUS"
            exit 1
          fi
