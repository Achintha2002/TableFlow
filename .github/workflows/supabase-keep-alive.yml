name: Keep Supabase Active

on:
  schedule:
    # Dawas 4kata serayak run wenawa (UTC 00:00)
    - cron: '0 0 */4 * *'
  workflow_dispatch: # Actions tab eken manually run karanna puluwan

jobs:
  ping-supabase:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase API
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          # 1. Clean whitespace, newlines, carriage returns, and quotes
          CLEAN_URL=$(echo "$SUPABASE_URL" | tr -d '\r\n "' | sed 's:/*$::')
          CLEAN_KEY=$(echo "$SUPABASE_ANON_KEY" | tr -d '\r\n "')

          # 2. Check if secrets are missing
          if [ -z "$CLEAN_URL" ]; then
            echo "❌ Error: SUPABASE_URL secret is empty or missing! Please check GitHub Secrets."
            exit 1
          fi

          if [ -z "$CLEAN_KEY" ]; then
            echo "❌ Error: SUPABASE_ANON_KEY secret is empty or missing! Please check GitHub Secrets."
            exit 1
          fi

          # 3. Format endpoint URL
          if [[ "$CLEAN_URL" == */rest/v1* ]]; then
            ENDPOINT="$CLEAN_URL"
          else
            ENDPOINT="$CLEAN_URL/rest/v1/"
          fi

          echo "Target endpoint base configured."

          # 4. Ping Supabase
          HTTP_STATUS=$(curl -sS -o /dev/null -w "%{http_code}" -X GET "$ENDPOINT" \
            -H "apikey: $CLEAN_KEY" \
            -H "Authorization: Bearer $CLEAN_KEY")

          echo "Supabase HTTP response code: $HTTP_STATUS"

          if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 400 ]; then
            echo "✅ Success! Supabase is active."
          else
            echo "❌ Failed to ping Supabase. HTTP Status: $HTTP_STATUS"
            exit 1
          fi
